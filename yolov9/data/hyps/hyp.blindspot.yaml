# ============================================================
# hyp.blindspot.yaml
# Hyperparameters cho Truck Blind Spot Detection (YOLOv9)
# Tối ưu cho camera cố định, ROI blind spot, và điều kiện
# giao thông thực tế: ngày/đêm, mưa nhẹ, ánh sáng yếu.
# ============================================================

# --- Optimizer & Learning Rate ---
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005

warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# --- Loss Function Weights ---
box: 7.5
cls: 0.5
cls_pw: 1.0
obj: 0.7
obj_pw: 1.0
dfl: 1.5

# --- Anchor & IoU Training ---
iou_t: 0.20
anchor_t: 5.0
fl_gamma: 0.0

# --- Color Augmentation ---
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.4

# --- Geometric Augmentation ---
degrees: 0.0
translate: 0.1
scale: 0.4
shear: 0.0
perspective: 0.0

# --- Flip Augmentation ---
flipud: 0.0
fliplr: 0.0

# --- YOLO Special Augmentations ---
mosaic: 0.4
mixup: 0.0
copy_paste: 0.0